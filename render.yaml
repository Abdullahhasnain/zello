services:
  - type: web
    name: zello-ai-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_APP
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "3"
      - key: REDIS_URL
        sync: false
      - key: AUTH_PROVIDER
        value: auth0
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: PARTNER_API_HMAC_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        value: sk-not-configured
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: AI_PROVIDER
        value: gemini
      - key: AI_ASSISTANT_ENABLED
        value: "true"
      - key: VOICE_ENABLED
        value: "true"
      - key: VOICE_TTS_PROVIDER
        value: edge
      - key: VOICE_EDGE_TTS_VOICE
        value: en-US-AvaMultilingualNeural
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: zello-ai-dashboard
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/dashboard/Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: AUTH_PROVIDER
        value: auth0
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_SECRET
        generateValue: true
      - key: AUTH0_AUDIENCE
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /dashboard
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /onboarding

  - type: web
    name: zello-ai-admin
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/admin/Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: AUTH_PROVIDER
        value: auth0
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_SECRET
        generateValue: true
      - key: AUTH0_AUDIENCE
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: ADMIN_ALLOWED_IP_RANGES
        value: ""
